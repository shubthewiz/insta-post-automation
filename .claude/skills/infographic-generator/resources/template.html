<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: linear-gradient(160deg, #11161f 0%, #1a2332 55%, #0d1017 100%);
    color: #ffffff;
    overflow: hidden;
  }
  .slide {
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    padding: 72px;
    position: relative;
  }
  .top {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .footer { flex-shrink: 0; }
  .accent-bar {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 14px;
    background: var(--accent);
  }
  .kicker {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
  }
  .number {
    font-size: 140px;
    font-weight: 800;
    color: var(--accent);
    opacity: 0.55;
    line-height: 1;
    margin-bottom: 8px;
  }
  .heading {
    font-size: 72px;
    font-weight: 800;
    line-height: 1.12;
    margin-bottom: 28px;
    max-width: 920px;
  }
  .subheading, .body {
    font-size: 36px;
    font-weight: 400;
    line-height: 1.5;
    color: #cfd6e4;
    max-width: 860px;
  }
  .title .heading { font-size: 88px; }
  .title .subheading { font-size: 40px; color: #ffffff; opacity: 0.85; }
  .cta .heading { color: var(--accent); }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    height: 56px;
    max-width: 220px;
    object-fit: contain;
    opacity: 0.95;
  }
  .swipe-hint {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8f99ad;
  }
</style>
</head>
<body>
  <div class="slide {{kindClass}}" style="--accent: {{accent}};">
    <div class="accent-bar"></div>
    <div class="top">
      {{#if kicker}}<div class="kicker">{{kicker}}</div>{{/if}}
      {{#if number}}<div class="number">{{number}}</div>{{/if}}
      <div class="heading">{{heading}}</div>
      {{#if body}}<div class="body">{{body}}</div>{{/if}}
      {{#if subheading}}<div class="subheading">{{subheading}}</div>{{/if}}
    </div>
    <div class="footer">
      {{#if logo}}<img class="logo" src="{{logo}}" />{{else}}<span></span>{{/if}}
      <span class="swipe-hint">{{swipeHint}}</span>
    </div>
  </div>
</body>
</html>
